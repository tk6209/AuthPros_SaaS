version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authpros
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  server:
    build: ./server
    command: npm run dev
    working_dir: /app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/authpros
      - JWT_SECRET=change_me
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=4000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
    ports:
      - "4000:4000"
volumes:
  pgdata:
